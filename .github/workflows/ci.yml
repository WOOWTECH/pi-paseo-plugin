name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PI_PASEO_SKIP_POSTINSTALL: '1'
      PI_PASEO_DISCOVERY_ONLY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm test
      - run: node --test scripts/install-host.test.mjs
      - run: npm run typecheck
      - run: node --check bin/install-host.mjs && bash -n scripts/install.sh
      - run: node scripts/check-package.mjs
      - run: node scripts/verify-package-install.mjs
