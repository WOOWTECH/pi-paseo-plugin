name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PI_PASEO_SKIP_POSTINSTALL: '1'
      PI_PASEO_DISCOVERY_ONLY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm audit --omit=dev
      - run: npm audit --omit=dev --prefix runtime
      - run: npm test
      # Ubuntu's default umask for a user with a private group: upstream Paseo's paseo.pid is 0664.
      - run: umask 002 && node --test tests/daemon-identity.test.mjs
      - run: node --test tests/smart-parity/*.test.mjs tests/smart-parity/provider/*.test.mjs tests/smart-parity/browser/*.test.mjs
      - run: node --test scripts/install-host.test.mjs
      - run: node --test scripts/bootstrap.test.mjs
      - run: npm run typecheck
      - run: node --check bin/install-host.mjs && bash -n scripts/install.sh
      - run: node scripts/check-package.mjs
      - run: node scripts/verify-smart-tasks.mjs
      - name: Devices RPC and listener confirmation on an isolated loopback daemon
        run: |
          mkdir -p "$RUNNER_TEMP/devices-runtime"
          cp runtime/package.json runtime/package-lock.json "$RUNNER_TEMP/devices-runtime/"
          npm ci --prefix "$RUNNER_TEMP/devices-runtime" --omit=dev --ignore-scripts --no-audit --no-fund
          DEVICES_TEST_RUNTIME="$RUNNER_TEMP/devices-runtime" node --input-type=module - <<'JS'
          import {applyPidLockPatch} from './src/pid-lock-patch.mjs';
          import {applyBrandIdentityPatch} from './src/brand-identity-patch.mjs';
          import {applySmartTasksPatch} from './src/smart-tasks-patch.mjs';
          const root=process.env.DEVICES_TEST_RUNTIME;
          applyPidLockPatch(root);applyBrandIdentityPatch(root);applySmartTasksPatch(root);
          JS
          node scripts/verify-devices.mjs "$RUNNER_TEMP/devices-runtime"
      - run: node scripts/verify-package-install.mjs
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/paseo-playwright
      PI_PASEO_SKIP_POSTINSTALL: '1'
      PI_PASEO_DISCOVERY_ONLY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: node scripts/verify-host.mjs
        env:
          PI_WEB_SCROLL_E2E: '1'
