name: Publish release package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, such as v0.1.9
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: release-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify source, publish missing assets and check anonymous downloads
        run: python3 tooling/.github/scripts/publish-release-package.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_SOURCE: release-source
          PI_PASEO_SKIP_POSTINSTALL: '1'
