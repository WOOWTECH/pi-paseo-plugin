name: macOS Agent Connect locks and lifecycle
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            node: '22.23.4'
          - runner: macos-15-intel
            arch: x64
            node: '22.19.0'
    env:
      PI_PASEO_SKIP_POSTINSTALL: '1'
      PI_PASEO_DISCOVERY_ONLY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Assert actual macOS architecture
        run: node -e "if(process.platform!=='darwin'||process.arch!=='${{ matrix.arch }}')process.exit(1)"
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Real OS guard contention, process death, state and onboarding
        run: node --test tests/sqlite-lock-guard.test.mjs tests/onboarding.test.mjs
      - name: Actual daemon start, stop and restart without provider credentials
        run: MACOS_EVIDENCE_DIR="$RUNNER_TEMP/paseo-macos-evidence" node tests/macos-runtime-smoke.mjs
      - name: Retain nonsecret lifecycle receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-lifecycle-${{ matrix.arch }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/paseo-macos-evidence
          if-no-files-found: ignore
