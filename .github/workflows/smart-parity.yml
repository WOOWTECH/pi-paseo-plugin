name: Smart web public parity baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARITY_OUTPUT: artifacts/smart-parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Validate evidence rejection rules
        run: node --test tests/smart-parity/*.test.mjs
      - name: Install checksum-pinned Craft CLI
        run: python3 tests/smart-parity/setup-craft.py artifacts/smart-parity/tools
      - name: Install the acceptance browser
        run: |
          npm install --prefix "$RUNNER_TEMP/parity-tools" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.63.0
          "$RUNNER_TEMP/parity-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify active conversation controls in Chromium
        run: |
          SMART_PARITY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/parity-tools/node_modules/playwright/index.mjs" node tests/smart-parity/browser/conversation-controls.browser-check.mjs
      - name: Record and compare three real public web apps
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/parity-tools/node_modules/playwright/index.mjs" node tests/smart-parity/baseline.mjs
      - name: Retain public baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-web-public-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/smart-parity/**
            !artifacts/smart-parity/tools/**
          retention-days: 7
          if-no-files-found: warn
